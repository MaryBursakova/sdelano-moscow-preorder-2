<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Сделано в Москве — предзаказ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="assets/brand/logo.jpg" alt="Сделано в Москве кофейня">
      </div>
      <h1>ПРЕДЗАКАЗ</h1>
      <p class="hero-copy">Выберите товары и заберите во время перерыва</p>
      <div class="chips" id="chips"></div>
    </header>

    <section class="menu">
      <div class="grid" id="menu"></div>
      <nav class="bottom-nav">
        <span>Меню</span><span>Мои заказы</span><span>Информация</span>
      </nav>
    </section>

    <button class="cartbar empty" id="cartbar">
      <span>Корзина пуста</span><span>0 ₽</span>
    </button>
  </main>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheetContent"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
